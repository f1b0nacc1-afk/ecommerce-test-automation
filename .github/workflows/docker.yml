name: Docker

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docker-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Run API tests in Docker
        run: docker compose run --rm api-tests

  docker-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Run smoke tests in Docker
        run: docker compose run --rm smoke-tests
